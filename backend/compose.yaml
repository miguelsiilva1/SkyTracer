# SkyTracer on a home server: the backend behind Tailscale Funnel (public HTTPS, no open ports).
# The Tailscale container owns the network; the backend shares it and listens on 127.0.0.1:8080.
services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: skytracer-tailscale
    hostname: skytracer
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ./tailscale/state:/var/lib/tailscale
      - ./tailscale/serve.json:/config/serve.json:ro
    restart: unless-stopped
    mem_limit: 128m

  backend:
    build: .
    container_name: skytracer-backend
    network_mode: service:tailscale
    env_file: .env
    depends_on: [tailscale]
    restart: unless-stopped
    mem_limit: 256m
