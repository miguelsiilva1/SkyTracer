<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Demo MapLibre — STAER</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
  #map { position: absolute; inset: 0; }
  #panel {
    position: absolute; top: 12px; left: 12px; z-index: 1;
    background: rgba(20,24,30,.9); color: #e8ecf1;
    padding: 12px 14px; border-radius: 10px; width: 260px; font-size: 13px;
  }
  #panel h1 { font-size: 15px; margin: 0 0 8px; }
  #panel label { display: block; margin: 10px 0 4px; }
  #panel input[type=range] { width: 100%; }
  #status { margin-top: 10px; color: #9aa4b2; font-size: 12px; line-height: 1.4; }
  button { margin-top: 8px; background: #2d6cdf; color: #fff; border: 0; border-radius: 6px; padding: 6px 10px; cursor: pointer; font-size: 12px; }
  .legend { display: flex; gap: 6px; margin-top: 8px; font-size: 11px; flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: 4px; }
  .legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  .maplibregl-popup-content { font-size: 12px; line-height: 1.5; }
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <h1>✈ Demo MapLibre</h1>
  <div>Fonte: <strong id="src">simulada</strong></div>
  <button id="toggle">Tentar dados reais do professor</button>
  <label>Altitude mínima: <span id="altv">0</span> ft</label>
  <input id="alt" type="range" min="0" max="40000" step="1000" value="0">
  <label><input id="trails" type="checkbox" checked> Mostrar rastos</label>
  <div class="legend">
    <span><i style="background:#ffb020"></i>0</span>
    <span><i style="background:#3ddc84"></i>10k</span>
    <span><i style="background:#4aa3ff"></i>25k</span>
    <span><i style="background:#c77dff"></i>40k ft</span>
  </div>
  <div id="status"></div>
</div>

<script>
// ---------- Config ----------
const OPO = [-8.6781, 41.2481];                       // Aeroporto do Porto [lon, lat]
const PROF_URL = 'https://ads-b.jcboliveira.xyz/dump1090/data/aircraft.json';
const ALT_COLORS = ['interpolate', ['linear'], ['get', 'alt'],
  0, '#ffb020', 10000, '#3ddc84', 25000, '#4aa3ff', 40000, '#c77dff'];

let useReal = false, minAlt = 0, showTrails = true;
let current = [];                 // aviões normalizados
const trails = new Map();         // hex -> [[lon,lat], ...]

// ---------- Dados simulados ----------
const callsigns = ['TAP1942','RYR82KQ','EZY45TF','IBE3127','AFR1124','KLM1693','TAP6KN','VLG8462','EXS24RT','BAW502'];
const sim = callsigns.map((c, i) => ({
  hex: (0x4951c0 + i).toString(16), flight: c,
  lat: OPO[1] + (Math.random() - .5) * 1.6, lon: OPO[0] + (Math.random() - .5) * 2,
  track: Math.random() * 360, gs: 250 + Math.random() * 220,
  alt: i % 3 === 0 ? Math.round(2000 + Math.random() * 6000) : Math.round(20000 + Math.random() * 18000),
  squawk: String(1000 + Math.floor(Math.random() * 6777)), rssi: -(5 + Math.random() * 25)
}));

function stepSim(dt) {
  for (const a of sim) {
    const d = a.gs * 1852 * dt / 3600;                 // metros percorridos
    const r = a.track * Math.PI / 180;
    a.lat += d * Math.cos(r) / 111320;
    a.lon += d * Math.sin(r) / (111320 * Math.cos(a.lat * Math.PI / 180));
    a.track = (a.track + (Math.random() - .5) * 2 + 360) % 360;
    if (Math.abs(a.lat - OPO[1]) > 1.2 || Math.abs(a.lon - OPO[0]) > 1.6) a.track = (a.track + 180) % 360;
  }
  return sim.map(a => ({ ...a }));
}

// ---------- Normalização do aircraft.json ----------
// dump1090-mutability usa "altitude"/"speed"; dump1090-fa/readsb usam "alt_baro"/"gs"
function normalize(json) {
  return (json.aircraft || [])
    .filter(a => a.lat != null && a.lon != null)
    .map(a => {
      const rawAlt = a.alt_baro ?? a.altitude;
      return {
        hex: a.hex,
        flight: (a.flight || '').trim() || a.hex.toUpperCase(),
        lat: a.lat, lon: a.lon,
        track: a.track ?? 0,
        gs: a.gs ?? a.speed ?? null,
        alt: typeof rawAlt === 'number' ? rawAlt : 0,   // "ground" -> 0
        squawk: a.squawk ?? '—',
        rssi: a.rssi ?? null
      };
    });
}

// ---------- Ícone do avião (desenhado em canvas, SDF para poder colorir) ----------
function planeImage() {
  const s = 48, c = document.createElement('canvas');
  c.width = c.height = s;
  const g = c.getContext('2d');
  g.translate(s / 2, s / 2);
  g.fillStyle = '#fff';
  g.beginPath();
  g.moveTo(0,-20); g.lineTo(3,-8); g.lineTo(18,2); g.lineTo(18,6); g.lineTo(3,1);
  g.lineTo(2,12); g.lineTo(7,17); g.lineTo(7,20); g.lineTo(0,17); g.lineTo(-7,20);
  g.lineTo(-7,17); g.lineTo(-2,12); g.lineTo(-3,1); g.lineTo(-18,6); g.lineTo(-18,2);
  g.lineTo(-3,-8); g.closePath(); g.fill();
  return g.getImageData(0, 0, s, s);
}

const fc = features => ({ type: 'FeatureCollection', features });

// ---------- Mapa ----------
const map = new maplibregl.Map({
  container: 'map',
  style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
  center: OPO, zoom: 7.5
});
map.addControl(new maplibregl.NavigationControl(), 'bottom-right');
new maplibregl.Marker({ color: '#e5484d' }).setLngLat(OPO)
  .setPopup(new maplibregl.Popup().setHTML('<b>LPPR / OPO</b><br>Aeroporto Francisco Sá Carneiro'))
  .addTo(map);

map.on('load', () => {
  map.addImage('plane', planeImage(), { sdf: true });
  map.addSource('planes', { type: 'geojson', data: fc([]) });
  map.addSource('trails', { type: 'geojson', data: fc([]) });

  map.addLayer({ id: 'trails', type: 'line', source: 'trails',
    paint: { 'line-color': ALT_COLORS, 'line-width': 1.5, 'line-opacity': .7 } });

  map.addLayer({ id: 'planes', type: 'symbol', source: 'planes',
    layout: {
      'icon-image': 'plane', 'icon-size': .55,
      'icon-rotate': ['get', 'track'], 'icon-rotation-alignment': 'map',
      'icon-allow-overlap': true
    },
    paint: { 'icon-color': ALT_COLORS, 'icon-halo-color': '#000', 'icon-halo-width': 1 } });

  map.on('click', 'planes', e => {
    const f = e.features[0], p = f.properties;
    new maplibregl.Popup().setLngLat(f.geometry.coordinates).setHTML(
      `<b>${p.flight}</b><br>ICAO hex: ${p.hex}<br>Altitude: ${p.alt} ft<br>` +
      `Velocidade: ${p.gs} kt<br>Rumo: ${p.track}°<br>Squawk: ${p.squawk}`
    ).addTo(map);
  });
  map.on('mouseenter', 'planes', () => map.getCanvas().style.cursor = 'pointer');
  map.on('mouseleave', 'planes', () => map.getCanvas().style.cursor = '');

  tick();
  setInterval(tick, 1000);
});

// ---------- Ciclo de atualização ----------
const $ = id => document.getElementById(id);
const setStatus = t => $('status').textContent = t;

async function tick() {
  if (useReal) {
    try {
      const r = await fetch(PROF_URL, { cache: 'no-store' });
      current = normalize(await r.json());
      setStatus(`${current.length} aviões com posição (dados reais)`);
    } catch (err) {
      setStatus('Falhou — muito provavelmente CORS (o servidor do professor não deixa o browser ler o JSON diretamente). É exatamente por isto que o backend em Python faz de proxy.');
      useReal = false; updateSrc();
    }
  }
  if (!useReal) {
    current = stepSim(1);
    if (!$('status').textContent.startsWith('Falhou')) setStatus(`${current.length} aviões simulados à volta do OPO`);
  }
  for (const a of current) {
    const t = trails.get(a.hex) || [];
    t.push([a.lon, a.lat]);
    if (t.length > 60) t.shift();
    trails.set(a.hex, t);
  }
  render();
}

function render() {
  const vis = current.filter(a => a.alt >= minAlt);
  map.getSource('planes')?.setData(fc(vis.map(a => ({
    type: 'Feature',
    geometry: { type: 'Point', coordinates: [a.lon, a.lat] },
    properties: { hex: a.hex, flight: a.flight, alt: a.alt, squawk: a.squawk,
      gs: a.gs != null ? Math.round(a.gs) : '—', track: Math.round(a.track) }
  }))));
  map.getSource('trails')?.setData(fc(!showTrails ? [] : vis
    .map(a => ({ type: 'Feature', geometry: { type: 'LineString', coordinates: trails.get(a.hex) || [] }, properties: { alt: a.alt } }))
    .filter(f => f.geometry.coordinates.length > 1)));
}

function updateSrc() {
  $('src').textContent = useReal ? 'dump1090 do professor' : 'simulada';
  $('toggle').textContent = useReal ? 'Voltar a dados simulados' : 'Tentar dados reais do professor';
}

$('toggle').onclick = () => { useReal = !useReal; trails.clear(); setStatus(''); updateSrc(); tick(); };
$('alt').oninput = e => { minAlt = +e.target.value; $('altv').textContent = minAlt; render(); };
$('trails').onchange = e => { showTrails = e.target.checked; render(); };
</script>
</body>
</html>
