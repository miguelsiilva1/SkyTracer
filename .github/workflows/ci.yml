name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: skytracer
          POSTGRES_PASSWORD: skytracer
          POSTGRES_DB: skytracer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skytracer"
          --health-interval 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://skytracer:skytracer@localhost:5432/skytracer_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q -rs
